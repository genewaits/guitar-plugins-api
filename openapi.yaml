openapi: 3.0.3
info:
  title: Tone Lord API
  description: The ultimate, slightly arrogant REST API contract for bedroom shredders and true tone chasers who traded heavy tube amplifiers for digital perfection.
  version: 1.0.0

components:
  securitySchemes:
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your administrator JWT token to access write operations.

  schemas:
    Plugin:
      type: object
      properties:
        id:
          type: integer
          description: Unique database identifier for the plugin
          example: 1
        name:
          type: string
          description: Full name of the plugin
          example: "Archetype: Plini X"
        brand:
          type: string
          description: Company or developer name
          example: "Neural DSP"
        category:
          type: string
          description: Type of audio processing software
          example: "Amp Simulator"
        price_usd:
          type: number
          description: Retail price in USD
          example: 119.00
        has_demo:
          type: boolean
          description: Indicates if a free trial version is available
          example: true
        formats:
          type: array
          description: Supported audio plugin formats
          items:
            type: string
          example: ["VST3", "AU", "AAX", "Standalone"]
        included_gear:
          type: object
          description: Virtual gear included in the package
          properties:
            amplifiers:
              type: array
              items:
                type: string
              example: ["Clean Amp", "Crunch Amp", "Lead Amp"]
            effects:
              type: array
              items:
                type: string
              example: ["Compressor", "Overdrive", "Delay", "Reverb"]

    PluginInput:
      type: object
      required:
        - name
        - brand
        - category
        - price_usd
      properties:
        name:
          type: string
          example: "Tone King Imperial MKII"
        brand:
          type: string
          example: "Neural DSP"
        category:
          type: string
          example: "Amp Simulator"
        price_usd:
          type: number
          example: 99.00
        has_demo:
          type: boolean
          example: true
        formats:
          type: array
          items:
            type: string
          example: ["VST3", "AU"]

paths:
  /plugins:
    get:
      summary: Get all guitar plugins
      description: Returns a list of all available plugins, with optional filtering by brand or category. Anyone can view this list.
      parameters:
        - name: brand
          in: query
          required: false
          description: Filter plugins by manufacturer name
          schema:
            type: string
          example: "Neural DSP"
        - name: category
          in: query
          required: false
          description: Filter plugins by type
          schema:
            type: string
          example: "Amp Simulator"
      responses:
        '200':
          description: A successful response containing the list of plugins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'

    post:
      summary: Add a new plugin to the catalog
      description: Creates a new guitar plugin entry in the database. Requires administrator privileges.
      security:
        - AdminToken: []
      requestBody:
        required: true
        description: JSON object containing the details of the new plugin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInput'
      responses:
        '201':
          description: Plugin created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '401':
          description: Unauthorized. Missing or invalid Bearer token.
        '403':
          description: Forbidden. You do not have administrator permissions.
        '400':
          description: Invalid input data.

  /plugins/{id}:
    get:
      summary: Get plugin details by ID
      description: Returns detailed information, included gear, and formats for a single plugin.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the plugin
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Plugin details found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '404':
          description: Plugin not found in the database
