<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Guitar Plugins API Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://googleapis.com|Roboto:300,400,700" rel="stylesheet">
  <style> body { margin: 0; padding: 0; } </style>
</head>
<body>

  <!-- Наш встроенный OpenAPI файл. Теперь браузер точно его прочитает! -->
  <script id="spec" type="application/yaml">
openapi: 3.0.3
info:
  title: Guitar Plugins Catalog API
  description: Учебный проект API-документации каталога гитарных плагинов для портфолио.
  version: 1.0.0
paths:
  /plugins:
    get:
      summary: Получить список гитарных плагинов
      description: Возвращает список всех доступных VST/AU плагинов в каталоге.
      responses:
        '200':
          description: Успешный ответ
  /ping:
    get:
      summary: Проверка связи с сервером
      responses:
        '200':
          description: Сервер работает отлично!
  </script>

  <!-- Подключаем плеер Redoc -->
  <div id="redoc-container"></div>
  <script src="https://redoc.ly"></script>
  
  <script>
    const specElement = document.getElementById('spec');
    Redoc.init(specElement.textContent, {
      scrollYOffset: 50,
      hideDownloadButton: true,
      theme: { colors: { primary: { main: '#10b981' } } }
    }, document.getElementById('redoc-container'))
  </script>
</body>
</html>
